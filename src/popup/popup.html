<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #18191C;
      color: #F1F2F3;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #FB7299;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #9499A0;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #00AEEC;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <h3>Bilibili 文稿与字幕提取器</h3>
  <p>在任意 B 站视频播放页点击右侧「提取文稿」胶囊按钮，或使用快捷键 <b>Alt + S</b> 唤起面板。</p>
  <button id="btn-open">在当前标签页打开/切换面板</button>
  <script src="popup.js"></script>
</body>
</html>
